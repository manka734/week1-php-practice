<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Registration</title>
  </head>
  <body>
    <h1>Employee Registration Form</h1>

    <!-- Send the form information and selected document to process.php. -->
    <form action="process.php" method="POST" enctype="multipart/form-data">
      <p>
        <label for="employeeName">Employee Full Name:</label>
        <input type="text" id="employeeName" name="employeeName" required />
      </p>

      <p>
        <label for="employeeId">Employee ID:</label>
        <input type="text" id="employeeId" name="employeeId" required />
      </p>

      <p>
        Gender:
        <input type="radio" id="male" name="gender" value="Male" required />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female" />
        <label for="female">Female</label>
      </p>

      <p>
        <label for="department">Department:</label>
        <select id="department" name="department" required>
          <option value="">Choose a department</option>
          <option value="Human Resources">Human Resources</option>
          <option value="Finance">Finance</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Administration">Administration</option>
        </select>
      </p>

      <p>
        Employment Type:
        <input
          type="radio"
          id="fullTime"
          name="employmentType"
          value="Full-Time"
          required
        />
        <label for="fullTime">Full-Time</label>
        <input
          type="radio"
          id="partTime"
          name="employmentType"
          value="Part-Time"
        />
        <label for="partTime">Part-Time</label>
      </p>

      <p>
        <label for="basicSalary">Basic Salary:</label>
        <input
          type="number"
          id="basicSalary"
          name="basicSalary"
          min="0.01"
          step="0.01"
          required
        />
      </p>

      <p>
        <label for="allowance">Allowance:</label>
        <input
          type="number"
          id="allowance"
          name="allowance"
          min="0"
          step="0.01"
          value="0"
          required
        />
      </p>

      <p>
        <label for="deduction">Deduction:</label>
        <input
          type="number"
          id="deduction"
          name="deduction"
          min="0"
          step="0.01"
          value="0"
          required
        />
      </p>

      <p>
        <label for="yearsOfService">Years of Service:</label>
        <input
          type="number"
          id="yearsOfService"
          name="yearsOfService"
          min="0"
          step="1"
          value="0"
          required
        />
      </p>

      <p>
        <label for="employeeDocument">Employee Document:</label>
        <input
          type="file"
          id="employeeDocument"
          name="employeeDocument"
          required
        />
      </p>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
